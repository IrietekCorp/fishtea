# The framework's own gate. Three sites build against this repository at a tag or a sha, so a break here
# is a break in their deploy: it is cheaper to find it on a push than in a site's pipeline.
#
# What runs: the suite (against a real Postgres, per the house rule), both typecheck projects, and
# `release --check`, which verifies every version site already agrees. scripts/release.ts has called that
# "used by the test suite and CI" since it was written; this is the CI.
#
# What does not run: the needle pool. It is a Python service with a model behind it, and the tests that
# want it skip cleanly when FISHTEA_TEST_CLASSIFIER_URL answers nothing. Classifier accuracy is measured
# by `fishtea eval` against a labelled set, not by a workflow.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # 5434, not 5432. A test never points at a running stack, and the needle test calls pool.reload(),
      # which would otherwise swap a live application's tool set underneath it.
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: fishtea
          POSTGRES_PASSWORD: fishtea
          POSTGRES_DB: fishtea
        ports: ["5434:5432"]
        # -h localhost matters. Postgres's entrypoint starts the server twice: once on a unix socket
        # to run initdb and create the database, then again on TCP. A pg_isready with no host checks
        # the socket, so it can report healthy against that first temporary server and let the steps
        # begin on a port that is about to close. Asking over TCP cannot be satisfied by it.
        options: >-
          --health-cmd "pg_isready -h localhost -U fishtea -d fishtea"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      FISHTEA_TEST_DATABASE_URL: postgres://fishtea:fishtea@localhost:5434/fishtea

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      # A published advisory against anything installed fails the build. bun run deps names the move.
      - name: No known advisories
        run: bun audit

      # The second half of the health check, from where the tests sit: connect over TCP through the
      # framework's own connect(), and install the vector extension every migration opens with. A cold
      # database fails here in seconds instead of as thirty-one files of ECONNREFUSED after a typecheck.
      - name: The test database is usable
        run: bun scripts/ci-preflight.ts

      # packages/ui/src/plugins.generated.{css,ts} are derived and git-ignored; a fresh clone needs the
      # empty versions before anything typechecks.
      - name: Generated UI stubs
        run: bun run ui-assets-base

      - name: Versions agree
        run: bun run release --check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # The browser walkthrough: the a11y suite, the menu and the visitor's path, against a real stack.
      # Required here, so a skip fails rather than passing quietly.
      - name: Browser for the walkthrough
        working-directory: packages/ui
        run: bunx playwright install --with-deps chromium

      - name: Walkthrough
        env:
          FISHTEA_E2E_REQUIRED: "1"
          PGPASSWORD: fishtea
        run: |
          psql -h localhost -p 5434 -U fishtea -d fishtea -c 'CREATE DATABASE fishteae2e'
          bun run e2e

      # A walkthrough that fails in CI and nowhere else is a timing story, and Playwright keeps the
      # screenshot, the trace and the page's own error context that tell it.
      - name: Keep the walkthrough's evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough-results
          path: packages/ui/test-results
          retention-days: 7
